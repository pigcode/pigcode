# 发版：推 vX.Y.Z tag 时三个平台打包、跑打包后的冒烟测试，然后建一个 GitHub Release 草稿，由人检查后发布。
# 手动运行时只留 Actions artifact，不建 Release（内部测试包）。
# 流程和手工清单见 docs/release.md，决定见 pigcode/pigcode 的 ADR 0009、0010。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本号只有一个来源（ADR 0007）：tag 和 apps/desktop/package.json 必须一致。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

  # 每个平台单独打包并跑打包后的冒烟测试；任何一个失败都不会建草稿。
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: package:mac:all
            smoke: pnpm --dir apps/desktop run test:packaged
          - os: windows-latest
            package: package:win
            smoke: pnpm --dir apps/desktop run test:packaged
          - os: ubuntu-24.04
            package: package:linux
            smoke: xvfb-run -a pnpm --dir apps/desktop run test:packaged
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # 打包前先确认代码是好的：lint、类型和单元测试和 ci.yml 用同一套命令。
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --dir apps/desktop run ${{ matrix.package }}
      # 装好的应用能不能真的用起来，只有这一条会检查（#69）。
      - run: ${{ matrix.smoke }}
        env:
          PIGCODE_E2E: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap

  # 只在推 tag 时建草稿。发布本身是人工操作：安装包一旦发出去，撤回就很难。
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          flags=(--draft --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
          gh release upload "$TAG" release/* --clobber
