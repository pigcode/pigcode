# 发版：推 vX.Y.Z tag 时三个平台打包、跑打包后的冒烟测试，然后建一个 GitHub Release 草稿，由人检查后发布。
# 手动运行时只留 Actions artifact，不建 Release（内部测试包）。
# 流程和手工清单见 docs/release.md，决定见 pigcode/pigcode 的 ADR 0009、0010。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本号只有一个来源（ADR 0007）：tag 和 apps/desktop/package.json 必须一致。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

  # 每个平台单独打包并跑打包后的冒烟测试；任何一个失败都不会建草稿。
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: package:mac:all
            smoke: pnpm --dir apps/desktop run test:packaged
          - os: windows-latest
            package: package:win
            smoke: pnpm --dir apps/desktop run test:packaged
          - os: ubuntu-24.04
            package: package:linux
            smoke: xvfb-run -a pnpm --dir apps/desktop run test:packaged
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      # 启动 Electron 的任务不能用依赖缓存里的原生模块（node-pty），ci.yml 里也是这么装的。
      - run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      # 打包前先确认代码是好的：lint、类型和单元测试和 ci.yml 用同一套命令。
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # node-gyp 找 Visual Studio 时会跑一段 PowerShell，输出太长会撑爆 maxBuffer
      # （RangeError: stdout maxBuffer length exceeded），于是报「找不到 Visual Studio」。
      # 直接告诉它用哪个版本，跳过那段探测。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($install) {
              $major = ([regex]::Match($install, '20\d\d')).Value
              "GYP_MSVS_VERSION=$major" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "using Visual Studio $major at $install"
            }
          }
      - run: pnpm --dir apps/desktop run ${{ matrix.package }}
      # 装好的应用能不能真的用起来，只有这一条会检查（#69）。
      - run: ${{ matrix.smoke }}
        env:
          PIGCODE_E2E: "1"
          # 打包好的应用在测试期间别去查更新：查到新版本会弹窗、甚至在退出时装上。
          PIGCODE_UPDATE_CHECK: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap

  # 只在推 tag 时建草稿。发布本身是人工操作：安装包一旦发出去，撤回就很难。
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          # 这个 job 没有 checkout，gh 从哪里读仓库要显式给。
          repo=(-R "$GITHUB_REPOSITORY")
          # 重跑时草稿可能已经在了：只建一次。
          gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1 ||
            { flags=(--draft --title "$TAG" --generate-notes)
              if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
              gh release create "$TAG" "${flags[@]}" "${repo[@]}"; }
          gh release upload "$TAG" release/* --clobber "${repo[@]}"
