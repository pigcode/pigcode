name: Mobile

on:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 生成手机截图候选基线
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/desktop/package.json"
      - "apps/desktop/scripts/generate-mobile-theme.ts"
      - "apps/desktop/scripts/generate-mobile-contracts.ts"
      - "packages/ui-primitives/src/styles/tokens.css"
      - "packages/ui-primitives/src/theme/**"
      - "apps/host/src/mobile/**"
      - "packages/contracts/**"
      - "scripts/fixtures/*.dart"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/desktop/package.json"
      - "apps/desktop/scripts/generate-mobile-theme.ts"
      - "apps/desktop/scripts/generate-mobile-contracts.ts"
      - "packages/ui-primitives/src/styles/tokens.css"
      - "packages/ui-primitives/src/theme/**"
      - "apps/host/src/mobile/**"
      - "packages/contracts/**"
      - "scripts/fixtures/*.dart"
      - ".github/workflows/mobile.yml"

jobs:
  mobile:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: apk
          - runner: macos-15
            target: ios
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.target == 'apk'
        uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - if: matrix.target == 'apk'
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop exec playwright install --with-deps chromium --only-shell
          node apps/desktop/scripts/generate-mobile-theme.ts --check
      - name: Install the pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/pigcode-flutter"
          printf '%s\n' "$RUNNER_TEMP/pigcode-flutter/bin" >> "$GITHUB_PATH"
      - if: matrix.target == 'apk'
        working-directory: .
        run: node apps/desktop/scripts/generate-mobile-contracts.ts --check
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed app/lib app/test app/visual packages scripts ../../scripts/fixtures/*.dart
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: apps/mobile/packages/pigcode_transport
      - run: dart test
        working-directory: apps/mobile/packages/pigcode_client
      - run: flutter test
        working-directory: apps/mobile/app
      - if: matrix.target == 'ios' && inputs.update_visual_baselines != true
        name: 比对手机截图基线
        id: visual
        run: ./scripts/test-visual.sh
      - if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-diffs
          path: apps/mobile/app/visual/failures/
          if-no-files-found: ignore
          retention-days: 7
      - if: matrix.target == 'ios' && inputs.update_visual_baselines
        name: 生成手机截图候选基线
        run: ./scripts/test-visual.sh --update-goldens
      - if: matrix.target == 'ios' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-baselines
          path: apps/mobile/app/visual/baselines/*.png
          if-no-files-found: error
          retention-days: 7
      - if: matrix.target == 'apk'
        run: ./scripts/flutter-app.sh build apk --debug --no-pub
      - if: matrix.target == 'ios'
        run: ./scripts/flutter-app.sh build ios --simulator --debug --no-pub
