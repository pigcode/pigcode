name: ci
# workflow_dispatch：visual-baselines 用 GITHUB_TOKEN 提交的基线不会触发 push，需要手动跑一次。
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      # 一个平台失败时其他平台照样跑完，才能看到各自的结果。
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # 固定镜像：视觉基线由 visual-baselines.yml 在同一个镜像上生成。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # Electron 需要虚拟显示；globalSetup 会先构建 main/preload/renderer 与 Host。
      # 全部 E2E 与视觉回归；真实 Claude/Codex 用例没有 PIGCODE_REAL_* 时自行跳过。
      - run: xvfb-run -a pnpm --dir apps/desktop exec playwright test
        env:
          PIGCODE_E2E: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
