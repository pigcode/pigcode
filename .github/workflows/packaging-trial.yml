name: packaging-trial
# 实验（pigcode/pigcode#15）：三个平台打未签名安装包，只记录产物，不发布。
on:
  push:
    branches: [experiment/packaging]
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: macos-arm64
          - os: macos-latest
            script: package:mac:x64
            artifact: macos-x64
          - os: windows-latest
            script: package:win
            artifact: windows-x64
          - os: ubuntu-latest
            script: package:linux
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: warn
