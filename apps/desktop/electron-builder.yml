# 未签名打包（见 adr/0005）。appId 与 productName 公开分发前再确认。
appId: com.pigcode.desktop
productName: Pigcode
directories:
  output: dist
# 更新源就是 GitHub Release（ADR 0010）。写在这里，打包时才会生成 latest*.yml；
# 实际发布由 .github/workflows/release.yml 建草稿再人工发布，所以脚本里仍然用 --publish never。
publish:
  provider: github
  owner: pigcode
  repo: frontend
files:
  - out/**/*
  - package.json
# 分发时要保留的许可证：Pigcode 自己的，以及随包分发的第三方声明（scripts/notices.ts 生成）。
extraResources:
  - from: build/LICENSE.txt
    to: LICENSE.txt
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # 应用里还有 Electron 和 Chromium；macOS 上 electron-builder 不会自动带这两份声明。
  - from: build/Electron-LICENSE.txt
    to: Electron-LICENSE.txt
  - from: build/LICENSES.chromium.html
    to: LICENSES.chromium.html
# node-pty 和 better-sqlite3 带原生二进制，esbuild 的平台二进制由可执行文件启动，都不能留在 asar 里；
# Host 产物整个解包，验证 ESM 能否从 asar 加载。pnpm 把 esbuild 的平台包放在 .pnpm 下，两条都解包。
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - node_modules/esbuild/**
  - "**/@esbuild/**"
  - "**/esbuild/**"
  - out/host/**
mac:
  identity: null
  target: [dmg]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target: [AppImage, deb]
  category: Development
# 包名是 @pigcode/desktop，默认的 deb 文件名会带上 scope 变成 dist/@pigcode/desktop_…，
# 那个目录不存在，打包会失败。显式给个不带斜杠的名字。
deb:
  artifactName: Pigcode-${version}-${arch}.deb
