# 实验（pigcode/pigcode#15）：最小可用的 electron-builder 配置，只用于未签名打包试验。
appId: com.pigcode.desktop
productName: Pigcode
directories:
  output: dist
files:
  - out/**/*
  - package.json
# 原生模块与 esbuild 的平台二进制不能留在 asar 内；Host 产物先整个解包，验证 ESM 能否从 asar 加载。
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - node_modules/esbuild/**
  - "**/@esbuild/**"
  - "**/esbuild/**"
  - out/host/**
mac:
  identity: null
  target: [dmg]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target: [AppImage, deb]
  category: Development
